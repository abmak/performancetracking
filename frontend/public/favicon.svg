<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="vGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="vShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow2">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#16a34a" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Animated glow pulse -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.3">
    <animate attributeName="r" values="20;26;20" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.05;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Main V letter — extra bold, fills the canvas -->
  <text x="32" y="52" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="60" font-weight="900" fill="url(#vGrad)" filter="url(#shadow2)">V</text>

  <!-- Shine overlay -->
  <text x="32" y="52" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="60" font-weight="900" fill="url(#vShine)">V</text>

  <!-- Pulsing dot -->
  <circle cx="52" cy="10" r="3.5" fill="#22c55e">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="r" values="3.5;5;3.5" dur="1.5s" repeatCount="indefinite"/>
  </circle>
</svg>
